spring.application.name=app-avaliacoes

# Auth0 JWT Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-1vbhhb524hr3h5zd.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api-avaliacoes

# PostgreSQL (AWS)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:prova_db}
spring.datasource.username=${DB_USERNAME:usuario}
spring.datasource.password=${DB_PASSWORD:senha}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080