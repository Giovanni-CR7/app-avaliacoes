name: Deploy Back-End to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven (No Tests)
        run: ./mvnw -B clean package -DskipTests --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "givil"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: givil/app-avaliacoes:${{ github.sha }}

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            # 1. Garante o PostgreSQL rodando na porta 5432 da máquina
            docker start postgres-db || docker run -d --name postgres-db \
              --network host \
              -e POSTGRES_DB=prova_db \
              -e POSTGRES_USER=usuario \
              -e POSTGRES_PASSWORD=senha \
              postgres:15-alpine
            
            sleep 5
            
            # 2. Sobe o Spring Boot direto na porta 80 da máquina (que é liberada na AWS)
            docker stop app-avaliacoes || true
            docker rm --force app-avaliacoes || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/app-avaliacoes:latest
            docker run -d --network host \
              -e SERVER_PORT=80 \
              --name app-avaliacoes \
              ${{ secrets.DOCKER_USERNAME }}/app-avaliacoes:latest
            
            sleep 10
            docker ps -a
            docker logs app-avaliacoes